name: Plugins - Backend - Test and build
description: Tests, lints and builds the backend.

inputs:
  github-token:
    description: GitHub token for downloading dependencies from private repos, if necessary
    required: true
  plugin-directory:
    description: Directory of the plugin, if not in the root of the repository.
    required: false
    default: .
  secrets:
    required: false
    type: string
    description: Secrets to expose to the backend build process through environment variables
  race-detector:
    required: false
    type: boolean
    description: Whether to run the tests with the race detector
    default: "true"
  build-target:
    required: false
    type: string
    description: Custom mage target to use for building the backend. Defaults to "buildAll". Useful for building for custom architectures not supported in the SDK yet, such as s390x or Windows ARM64.
    default: buildAll
  run-lint:
    description: Whether to run `golangci-lint`.
    required: false
    default: "true"
  run-tests:
    description: Whether to run the Mage `test` or `testRace` target.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Config git to use GitHub token
      run: git config --global url."https://oauth2:${INPUT_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      shell: bash

    - name: Get secrets from Vault
      if: inputs.secrets != ''
      id: get-secrets
      uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
      with:
        repo_secrets: ${{ inputs.secrets }}

    - name: Install dependencies
      run: go mod download
      working-directory: ${{ inputs.plugin-directory }}
      shell: bash

    - name: Lint
      if: inputs.run-lint == 'true'
      # Only scope to `./pkg/...`: some node_modules include Go files
      # and may cause golangci-lint to fail with unactionable errors.
      run: golangci-lint run --timeout=5m ./pkg/...
      working-directory: ${{ inputs.plugin-directory }}
      shell: bash

    - name: Test
      if: inputs.run-tests == 'true'
      run: |
        if [ "$RACE_DETECTOR" = "true" ]; then
          mage -v testRace
        else
          mage -v test
        fi
      working-directory: ${{ inputs.plugin-directory }}
      shell: bash
      env:
        RACE_DETECTOR: ${{ inputs.race-detector }}

    - name: Build
      run: |
        while IFS= read -r key; do
          [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]] || { echo "::error::invalid secret name: $key"; exit 1; }
          export "$key=$(jq -r --arg k "$key" '.[$k]' <<<"$SECRETS_JSON")"
        done < <(jq -r 'keys[]' <<<"$SECRETS_JSON")
        unset SECRETS_JSON
        mage -v ${BUILD_TARGET}
      working-directory: ${{ inputs.plugin-directory }}
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.build-target }}
        SECRETS_JSON: ${{ steps.get-secrets.outputs.secrets || '{}' }}
