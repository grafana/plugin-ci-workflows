name: Plugins - Frontend - Test and build
description: Tests, lints, typechecks and builds the frontend.

inputs:
  plugin-directory:
    description: Directory of the plugin, if not in the root of the repository.
    required: false
    default: .
  secrets:
    required: false
    type: string
    description: The secrets to use within frontend steps
  npm-registry-auth:
    description: |
      Whether to authenticate to the npm registry in Google Artifact Registry.
      If true, the root of the plugin repository must contain a `.npmrc` file.
    required: false
    default: "false"
  run-lint:
    description: Whether to run the `lint` script.
    required: false
    default: "true"
  run-typecheck:
    description: Whether to run the `typecheck` script.
    required: false
    default: "true"
  run-tests:
    description: Whether to run the `test:ci` script.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Get secrets from Vault
      if: inputs.secrets != ''
      id: get-secrets
      uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
      with:
        repo_secrets: ${{ inputs.secrets }}

    - name: Login to Google Cloud
      if: inputs.npm-registry-auth == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        token_format: access_token
        workload_identity_provider: "projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider"
        service_account: github-plugin-ci-workflows@grafanalabs-workload-identity.iam.gserviceaccount.com

    - name: NPM registry auth
      if: inputs.npm-registry-auth == 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }} npx google-artifactregistry-auth --credential-config ./.npmrc

    - name: Detect package manager
      id: package-manager
      uses: grafana/plugin-actions/package-manager-detect@package-manager-detect/v1.0.1
      with:
        working-directory: ${{ inputs.plugin-directory }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.frozenInstallCmd }}

    - name: Lint
      if: inputs.run-lint == 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} lint

    - name: Typecheck
      if: inputs.run-typecheck == 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} typecheck

    - name: Test
      if: inputs.run-tests == 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} test:ci

    - name: Build
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      env:
        SECRETS_JSON: ${{ steps.get-secrets.outputs.secrets || '{}' }}
      run: |
        while IFS= read -r key; do
          [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]] || { echo "::error::invalid secret name: $key"; exit 1; }
          export "$key=$(jq -r --arg k "$key" '.[$k]' <<<"$SECRETS_JSON")"
        done < <(jq -r 'keys[]' <<<"$SECRETS_JSON")
        unset SECRETS_JSON

        ${{ steps.package-manager.outputs.runCmd }} build
