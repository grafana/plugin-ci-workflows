name: Plugins - Frontend - Test and build
description: Tests, lints, typechecks and builds the frontend.

inputs:
  plugin-directory:
    description: Directory of the plugin, if not in the root of the repository.
    required: false
    default: .
  secrets:
    required: false
    type: string
    description: The secrets to use within frontend steps
  npm-registry-auth:
    description: |
      Whether to authenticate to the npm registry in Google Artifact Registry.
      If true, the root of the plugin repository must contain a `.npmrc` file.
    required: false
    default: "false"
  skip-lint:
    description: Skip the lint step.
    required: false
    default: "false"
  skip-typecheck:
    description: Skip the typecheck step.
    required: false
    default: "false"
  skip-test:
    description: Skip the test step.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Get secrets from Vault
      if: inputs.secrets != ''
      id: get-secrets
      uses: grafana/shared-workflows/actions/get-vault-secrets@3b321a9af994a0b7d8caa3130f3cd9b5cc08fd7a # get-vault-secrets/v2.0.2
      with:
        repo_secrets: ${{ inputs.secrets }}

    - name: Login to Google Cloud
      if: inputs.npm-registry-auth == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        token_format: access_token
        workload_identity_provider: "projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider"
        service_account: github-plugin-ci-workflows@grafanalabs-workload-identity.iam.gserviceaccount.com

    - name: NPM registry auth
      if: inputs.npm-registry-auth == 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }} npx google-artifactregistry-auth --credential-config ./.npmrc

    - name: Detect package manager
      id: package-manager
      uses: grafana/plugin-actions/package-manager-detect@package-manager-detect/v1.0.1
      with:
        working-directory: ${{ inputs.plugin-directory }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.frozenInstallCmd }}

    - name: Lint
      if: inputs.skip-lint != 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} lint

    - name: Typecheck
      if: inputs.skip-typecheck != 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} typecheck

    - name: Test
      if: inputs.skip-test != 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} test:ci

    - name: Build
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} build
