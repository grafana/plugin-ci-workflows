name: Plugins - Frontend - Test and build
description: Tests, lints, typechecks and builds the frontend.

inputs:
  plugin-directory:
    description: Directory of the plugin, if not in the root of the repository.
    required: false
    default: .
  secrets:
    required: false
    type: string
    description: The secrets to use within frontend steps
  npm-registry-auth:
    description: |
      Whether to authenticate to the npm registry in Google Artifact Registry.
      If true, the root of the plugin repository must contain a `.npmrc` file.
    required: false
    default: "false"
  install-cmd:
    description: |
      Command to install dependencies, with the install scripts policy already applied
      (output `node-package-manager-install-cmd` of the internal setup action).
    required: true
  yarn-enable-scripts:
    description: |
      Yarn Berry (v2+) only: value to export as YARN_ENABLE_SCRIPTS
      (env form of the `enableScripts` .yarnrc.yml setting)
      for the install step only (output
      `node-package-manager-yarn-enable-scripts` of the setup action).
      Empty for npm, pnpm and Yarn Classic (v1 ignores this variable).
      Leave empty to not set it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Get secrets from Vault
      if: inputs.secrets != ''
      id: get-secrets
      uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
      with:
        repo_secrets: ${{ inputs.secrets }}

    - name: Login to Google Cloud
      if: inputs.npm-registry-auth == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        token_format: access_token
        workload_identity_provider: "projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider"
        service_account: github-plugin-ci-workflows@grafanalabs-workload-identity.iam.gserviceaccount.com

    - name: NPM registry auth
      if: inputs.npm-registry-auth == 'true'
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }} npx google-artifactregistry-auth --credential-config ./.npmrc

    - name: Detect package manager
      id: package-manager
      uses: grafana/plugin-actions/package-manager-detect@package-manager-detect/v1.0.1
      with:
        working-directory: ${{ inputs.plugin-directory }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: |
        if [ -z "${INSTALL_CMD}" ]; then
          echo "::error::The install-cmd input is required and must not be empty"
          exit 1
        fi
        # Yarn Berry (v2+) only: YARN_ENABLE_SCRIPTS is the env form of
        # `enableScripts` in .yarnrc.yml. Empty for npm, pnpm and Yarn
        # Classic, which ignores it: its command uses --ignore-scripts for
        # "none" and the "allowlist" fallback.
        if [ -n "${INSTALL_SCRIPTS_POLICY}" ]; then
          export YARN_ENABLE_SCRIPTS="${INSTALL_SCRIPTS_POLICY}"
        fi
        read -r -a cmd <<< "${INSTALL_CMD}"
        "${cmd[@]}"
      env:
        INSTALL_CMD: ${{ inputs.install-cmd }}
        INSTALL_SCRIPTS_POLICY: ${{ inputs.yarn-enable-scripts }}

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} lint

    - name: Typecheck
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} typecheck

    - name: Test
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} test:ci

    - name: Build
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: ${{ steps.package-manager.outputs.runCmd }} build
