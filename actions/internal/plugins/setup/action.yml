name: Plugins - Setup
description: Sets up the environment for building and testing the plugin.

inputs:
  plugin-directory:
    description: |
      Directory of the plugin, if not in the root of the repository.
    required: false
    default: .
  act-cache-warmup:
    description: |
      If true, run in a simplified mode for caching Node/Go tooling before running any tests with `act`.
      This will not attempt to detect the package manager or cache the plugin's dependencies.
      This should only be used when testing with `act`.
    required: false
    default: "false"
  go-version:
    description: |
      Go version to use.
      Either go-version or go-version-file should be provided.
    required: false
    default: ""
  go-version-file:
    description: |
      File containing the Go version to use (usually `go.mod`).
      Either go-version or go-version-file should be provided.
    required: false
    default: ""
  go-setup-caching:
    description: Defines if setup-go action should have caching enabled (https://github.com/actions/setup-go#caching-dependency-files-and-build-outputs)
    required: false
    default: "true"
  node-version:
    description: |
      Node.js version to use.
      Either node-version or node-version-file should be provided.
    required: false
    default: ""
  node-version-file:
    description: |
      File containing the Node.js version to use (usually `.nvmrc`).
      Either node-version or node-version-file should be provided.
    required: false
    default: ""
  frontend-only:
    description: |
      Accepts the string "true" or "false" (default). If "true", skip backend (Go) setup including Go, mage, and golangci-lint installation.
      Useful for workflows that only need Node.js and the package manager (e.g. Playwright tests).
    required: false
    default: "false"
  golangci-lint-version:
    description: golangci-lint version to use.
    required: false
    default: ""
  mage-version:
    description: mage version to use.
    required: false
    default: ""
  node-package-manager-scripts:
    description: |
      Controls the npm/pnpm/yarn install scripts (preinstall, install, postinstall, prepare, ...) run during dependency installation.
      One of:
      - "none": block every install script.
      - "allowlist" (default): only run install scripts of dependencies allowlisted in your package manager config.
        npm (--strict-allow-scripts) and pnpm 11 fail the install if a dependency with install scripts has no allow/deny entry.
        If the package manager can't enforce an allowlist, all install scripts are disabled and a warning is shown.
      - "all": run every dependency install script (last resort). On pnpm this needs pnpm >=10.9; older 10.x only builds "onlyBuiltDependencies" (with a warning).
      The project's own lifecycle scripts (root/workspace) still run with "allowlist" and "all"; "none" blocks those too.
      Allowlist: pnpm >=10 uses "allowBuilds" in pnpm-workspace.yaml (pnpm 10.26+/11) or "onlyBuiltDependencies" (older);
      npm >=11.16 uses "allowScripts" in package.json (see "npm approve-scripts" / "npm install-scripts approve");
      Yarn Berry uses "dependenciesMeta.<pkg>.built: true" in package.json; Yarn Classic has no allowlist (falls back to "none").
    required: false
    default: allowlist

outputs:
  node-version:
    description: The Node.js version that was installed.
    value: ${{ steps.node.outputs.node-version }}
  go-version:
    description: The Go version that was installed.
    value: ${{ steps.go.outputs.go-version }}
  node-package-manager-name:
    description: The name of the detected Node.js package manager (npm, yarn, or pnpm).
    value: ${{ steps.package-manager.outputs.name }}
  node-package-manager-version:
    description: The version of the detected Node.js package manager.
    value: ${{ steps.package-manager.outputs.version }}
  node-package-manager-frozen-install-cmd:
    description: The command to install dependencies with a frozen lockfile.
    value: ${{ steps.package-manager.outputs.frozenInstallCmd }}
  node-package-manager-exec-local-cmd:
    description: The command to execute a locally installed package (e.g. npx, yarn dlx, pnpm exec).
    value: ${{ steps.package-manager.outputs.execLocalCmd }}
  node-package-manager-install-cmd:
    description: The command to install dependencies with a frozen lockfile, with the install scripts policy applied.
    value: ${{ steps.scripts-policy.outputs.install-cmd }}
  node-package-manager-yarn-enable-scripts:
    description: |
      Yarn Berry (v2+) only: value to export as YARN_ENABLE_SCRIPTS
      (env form of the `enableScripts` .yarnrc.yml setting) when running
      the install command ("true" or "false").
      Empty for npm, pnpm and Yarn Classic (v1 ignores this variable).
    value: ${{ steps.scripts-policy.outputs.yarn-enable-scripts }}

runs:
  using: composite
  steps:
    - name: Detect package manager
      if: ${{ inputs.act-cache-warmup != 'true' }}
      id: package-manager
      uses: grafana/plugin-actions/package-manager-detect@package-manager-detect/v1.0.1
      with:
        working-directory: ${{ inputs.plugin-directory }}

    - name: Install pnpm
      if: ${{ inputs.act-cache-warmup != 'true' && steps.package-manager.outputs.name == 'pnpm' }}
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.plugin-directory }}/package.json

    - name: Node
      id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "${{ inputs.node-version }}"
        node-version-file: "${{ inputs.node-version-file }}"
        # pnpm is cached separately below. setup-node looks the store up by running
        # `pnpm store path` from the repository root, which is the wrong directory when
        # the plugin lives in a subfolder: nothing there pins a pnpm version, so corepack
        # answers with the newest release off the registry, and since pnpm 12 that
        # reports a store path no install ever creates.
        cache: ${{ (inputs.act-cache-warmup != 'true' && steps.package-manager.outputs.name != 'pnpm') && steps.package-manager.outputs.name || '' }}
        cache-dependency-path: ${{ inputs.act-cache-warmup != 'true' && steps.package-manager.outputs.lockFilePath || '' }}

    - name: Locate the pnpm store
      if: ${{ steps.package-manager.outputs.name == 'pnpm' }}
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.plugin-directory }}
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: ${{ steps.package-manager.outputs.name == 'pnpm' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-os=${{ runner.os }}-arch=${{ runner.arch }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.plugin-directory)) }}

    # Install additional dependencies that are not built-in to the slim act image
    # but are included in the default GitHub Actions runner image and are needed for plugin-ci-workflows.
    - name: Install additional act dependencies
      if: ${{ env.ACT }}
      shell: bash
      run: |
        # Enable corepack so that yarn (v4+) can be resolved via the packageManager
        # field in package.json. Corepack ships with Node.js 16.9+ and is the
        # recommended way to manage Yarn Berry versions.
        corepack enable

    - name: Determine install scripts policy
      if: ${{ inputs.act-cache-warmup != 'true' }}
      id: scripts-policy
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCRIPTS_MODE: ${{ inputs.node-package-manager-scripts }}
        PM_AGENT: ${{ steps.package-manager.outputs.agent }}
        FROZEN_INSTALL_CMD: ${{ steps.package-manager.outputs.frozenInstallCmd }}
        PLUGIN_DIRECTORY: ${{ inputs.plugin-directory }}
      with:
        script: |
          const scriptsPolicy = require(`${process.env.ACTION_PATH}/scripts-policy.cjs`);
          await scriptsPolicy({ core, exec });

    - name: Go
      if: ${{ inputs.frontend-only != 'true' }}
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "${{ inputs.go-version }}"
        go-version-file: "${{ inputs.go-version-file }}"
        cache: ${{ inputs.go-setup-caching == 'true' }}
        cache-dependency-path: ${{ inputs.act-cache-warmup != 'true' && format('{0}/go.sum', inputs.plugin-directory) || '' }}

    - name: Determine Go bin directory
      if: ${{ inputs.frontend-only != 'true' }}
      id: go-bin
      shell: bash
      run: echo "gobin=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"

    - name: Cache Go tooling
      if: ${{ inputs.frontend-only != 'true' }}
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-bin.outputs.gobin }}/golangci-lint
          ${{ steps.go-bin.outputs.gobin }}/mage
        key: go-tools-os=${{ runner.os }}-arch=${{ runner.arch }}-go=${{ steps.go.outputs.go-version }}-mage=${{ inputs.mage-version }}-golangci-lint=${{ inputs.golangci-lint-version }}

    - name: Mage
      if: ${{ inputs.frontend-only != 'true' && steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        go install github.com/magefile/mage@v${MAGE_VERSION}
      env:
        MAGE_VERSION: ${{ inputs.mage-version }}

    - name: golangci-lint
      if: ${{ inputs.frontend-only != 'true' && steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v${GOLANGCI_LINT_VERSION}
      env:
        GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
