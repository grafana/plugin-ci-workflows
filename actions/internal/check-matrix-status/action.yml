name: Check matrix status
description: Require all job results to be successful.

inputs:
  results:
    description: |
      A job result or a comma-separated list of job results.
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Check matrix job status
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: |
        if [[ ! "$RESULTS" =~ ^success(,success)*$ ]]; then
          echo "::error::Expected all jobs to succeed. Results: $RESULTS"
          exit 1
        fi
